name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.SUBMODULE_PAT }}

      - name: Prepare docs directory
        run: |
          # neuvecom-common用ディレクトリを作成
          mkdir -p docs/neuvecom-common
          # neuvecom-commonをdocs配下にコピー（静的ファイル用）
          cp -r neuvecom-common/js docs/neuvecom-common/
          cp -r neuvecom-common/css docs/neuvecom-common/
          cp -r neuvecom-common/img docs/neuvecom-common/
          # dataディレクトリをdocs配下にコピー
          cp -r data docs/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
